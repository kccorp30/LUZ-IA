<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --p1:#7c3aed;--p2:#4f46e5;--p3:#2563eb;--a1:#f97316;--a2:#fb923c;
  --g1:#10b981;--r1:#ef4444;--amber:#f59e0b;
  --brand:var(--p1);--brand2:var(--p2);--brand-glow:rgba(124,58,237,0.45);
  --glass-bg:rgba(255,255,255,0.07);--glass-bg2:rgba(255,255,255,0.12);
  --glass-border:rgba(255,255,255,0.14);--glass-border2:rgba(255,255,255,0.22);
  --text:#f1f0ff;--text2:rgba(241,240,255,0.6);--text3:rgba(241,240,255,0.35);
  --blur:blur(24px);--blur2:blur(40px);--shadow:0 8px 32px rgba(0,0,0,0.4);--shadow2:0 16px 48px rgba(0,0,0,0.5);
}

/* ── TEMA HELADERÍA — azul helado, cyan, pastel ── */
[data-negocio="heladeria"]{
  --brand:#0891b2;--brand2:#06b6d4;--brand-glow:rgba(8,145,178,0.45);
  --p1:#0891b2;--p2:#0e7490;--p3:#155e75;--a1:#f0abfc;--a2:#e879f9;
}
[data-negocio="heladeria"] body{background:#080810;background-image:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(124,58,237,0.18) 0%,transparent 55%),radial-gradient(ellipse 60% 50% at 90% 100%,rgba(79,70,229,0.12) 0%,transparent 50%),radial-gradient(ellipse 40% 40% at 50% 50%,rgba(37,99,235,0.06) 0%,transparent 60%);color:#f1f0ff;font-family:'Satoshi',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
[data-negocio="heladeria"] .blob-1{background:radial-gradient(circle,#0891b2,transparent 70%);}
[data-negocio="heladeria"] .blob-2{background:radial-gradient(circle,#7c3aed,transparent 70%);}
[data-negocio="heladeria"] .blob-3{background:radial-gradient(circle,#f0abfc,transparent 70%);}
[data-negocio="heladeria"] .blob-4{background:radial-gradient(circle,#06b6d4,transparent 70%);}
[data-negocio="heladeria"] .topbar{border-bottom-color:rgba(8,145,178,0.25);;box-shadow:0 1px 0 rgba(124,58,237,0.15),0 4px 24px rgba(0,0,0,0.35)}
[data-negocio="heladeria"] .fnav-center{background:linear-gradient(135deg,#0891b2,#0e7490)!important;box-shadow:0 4px 20px rgba(8,145,178,0.5)!important;}
[data-negocio="heladeria"] .pin-dot.filled{background:linear-gradient(135deg,#0891b2,#06b6d4);}
[data-negocio="heladeria"] .key:active{background:rgba(8,145,178,0.35);border-color:rgba(8,145,178,0.6);}
[data-negocio="heladeria"] .cfg-save{background:linear-gradient(135deg,#0891b2,#0e7490);}
[data-negocio="heladeria"] #planBadge{background:rgba(8,145,178,.15)!important;border-color:rgba(8,145,178,.3)!important;color:#67e8f9!important;}

/* ── TEMA SALSAMENTARIA — verde tierra, ámbar, cálido ── */
[data-negocio="heladeria"] .badd{background:linear-gradient(135deg,#0891b2,#0e7490)!important;}
[data-negocio="heladeria"] .met-tab.active{background:rgba(8,145,178,0.2);color:#67e8f9;border-bottom-color:#06b6d4;}
[data-negocio="heladeria"] .domi-asignar{background:linear-gradient(135deg,#0891b2,#0e7490)!important;}
[data-negocio="heladeria"] .ebtn.bcerrar{background:linear-gradient(135deg,rgba(8,145,178,0.25),rgba(8,145,178,0.15))!important;color:#67e8f9!important;border-color:rgba(8,145,178,0.4)!important;}
[data-negocio="heladeria"] .fnav-tab.active .fnav-label{background:linear-gradient(135deg,#67e8f9,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
[data-negocio="heladeria"] .fnav-tab.active .fnav-icon{filter:drop-shadow(0 0 8px rgba(6,182,212,0.8));}

[data-negocio="salsamentaria"]{
  --brand:#16a34a;--brand2:#15803d;--brand-glow:rgba(22,163,74,0.45);
  --p1:#16a34a;--p2:#15803d;--p3:#166534;--a1:#d97706;--a2:#b45309;
}
[data-negocio="salsamentaria"] body{background:#050d08;font-family:'Satoshi',sans-serif;}
[data-negocio="salsamentaria"] .blob-1{background:radial-gradient(circle,#16a34a,transparent 70%);}
[data-negocio="salsamentaria"] .blob-2{background:radial-gradient(circle,#d97706,transparent 70%);}
[data-negocio="salsamentaria"] .blob-3{background:radial-gradient(circle,#15803d,transparent 70%);}
[data-negocio="salsamentaria"] .blob-4{background:radial-gradient(circle,#b45309,transparent 70%);}
[data-negocio="salsamentaria"] .topbar{border-bottom-color:rgba(22,163,74,0.25);}
[data-negocio="salsamentaria"] .fnav-center{background:linear-gradient(135deg,#16a34a,#15803d)!important;box-shadow:0 4px 20px rgba(22,163,74,0.5)!important;}
[data-negocio="salsamentaria"] .pin-dot.filled{background:linear-gradient(135deg,#16a34a,#d97706);}
[data-negocio="salsamentaria"] .key:active{background:rgba(22,163,74,0.35);border-color:rgba(22,163,74,0.6);}
[data-negocio="salsamentaria"] .cfg-save{background:linear-gradient(135deg,#16a34a,#15803d);}
[data-negocio="salsamentaria"] #planBadge{background:rgba(22,163,74,.15)!important;border-color:rgba(22,163,74,.3)!important;color:#86efac!important;}

/* ── Restaurante — morado default ── */
[data-negocio="restaurante"] .pin-dot.filled{background:linear-gradient(135deg,#7c3aed,#2563eb);}
body{min-height:100vh;background:#0d0a1a;color:var(--text);font-family:'Satoshi',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.blobs::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(139,92,246,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,0.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.55;animation:blobFloat 9s ease-in-out infinite;}
.blob-1{width:520px;height:520px;background:radial-gradient(circle,#7c3aed 0%,rgba(124,58,237,0.4) 40%,transparent 70%);top:-150px;left:-120px;}
.blob-2{width:400px;height:400px;background:radial-gradient(circle,#4f46e5 0%,rgba(79,70,229,0.35) 40%,transparent 70%);top:25%;right:-100px;animation-delay:-3s}
.blob-3{width:300px;height:300px;background:radial-gradient(circle,#f97316,transparent 70%);bottom:-80px;left:30%;animation-delay:-5s;opacity:0.3}
.blob-4{width:250px;height:250px;background:radial-gradient(circle,#10b981,transparent 70%);bottom:20%;right:20%;animation-delay:-2s;opacity:0.2}
@keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-30px) scale(1.05)}66%{transform:translate(-15px,20px) scale(0.95)}}
#pinScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1;}
.pin-input-field{width:100%;padding:13px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:13px;color:#f0eeff;font-family:'Satoshi',sans-serif;font-size:14px;outline:none;box-sizing:border-box;}
.pin-input-field:focus{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.06);}
.pin-input-field::placeholder{color:rgba(255,255,255,.3);}
/* Hover states for country/type buttons */
#stepPais button:hover,#stepTipo button:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);}
.pin-box{width:100%;max-width:300px;background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.25);border-radius:32px;padding:36px 24px 32px;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 32px 80px rgba(0,0,0,0.6),0 0 60px rgba(124,58,237,0.15),inset 0 1px 0 rgba(255,255,255,0.1);}
.pin-brand{text-align:center;margin-bottom:28px;}
.pin-orb{width:68px;height:68px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,#7c3aed,#4f46e5,#2563eb);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:white;box-shadow:0 8px 24px rgba(124,58,237,0.6),inset 0 1px 0 rgba(255,255,255,0.3);font-family:JetBrains Mono,monospace;}
.pin-name{font-size:22px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.pin-sub{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0.14em;text-transform:uppercase;margin-top:3px;}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:24px;}
.pin-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);transition:all 0.2s;}
.pin-dot.filled{background:linear-gradient(135deg,#7c3aed,#2563eb);border-color:transparent;box-shadow:0 0 12px rgba(124,58,237,0.7);transform:scale(1.2);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.key{height:58px;width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:16px;font-size:20px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s;user-select:none;font-family:'Satoshi',sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.key:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.2)}
.key:active{transform:scale(0.91);background:rgba(124,58,237,0.35);border-color:rgba(124,58,237,0.6);box-shadow:0 0 16px rgba(124,58,237,0.4)}
